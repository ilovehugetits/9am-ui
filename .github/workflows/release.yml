name: release

# Triggered by ci finishing on main rather than by the push itself, so a commit
# whose checks are red can never be published. The tradeoff is that this run is
# detached from the push: it has to check out the exact commit ci tested.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Releases must not overlap: two runs publishing at once would race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
      id-token: write # OIDC identity for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+; the version bundled with node is
      # older and would fall back to asking for a token that does not exist.
      - name: Update npm
        run: npm install -g npm@latest

      # The release ritual is a version bump. Everything else on main — docs,
      # a component tweak, a README fix — lands without publishing anything.
      - name: Decide whether to publish
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view 9am-ui version 2>/dev/null || echo none)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$version" = "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "9am-ui@$version is already on npm — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing 9am-ui@$version (npm currently has $published)"
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: bun run build

      # No NPM_TOKEN: npm verifies this workflow's OIDC identity against the
      # trusted publisher configured on the package, and attaches provenance.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      # Creates the tag at this commit as a side effect, so the git history and
      # the npm versions stay in step.
      - name: Tag and create the GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.check.outputs.version }}"
          gh release create "$v" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$v" \
            --generate-notes
