version: 2
updates:
  # Action versions are safe to bump unattended: nothing in the registry output
  # depends on them, so these PRs go green on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  # `bun`, not `npm`: they are separate ecosystems to Dependabot, and the npm
  # one leaves bun.lock untouched. That produces a PR whose package.json and
  # lockfile disagree, which `bun install --frozen-lockfile` rejects before any
  # check gets to run — every such PR is dead on arrival.
  #
  # Even with the right ecosystem these need a human: build-registry.ts copies
  # each dependency's version range out of package.json into registry.json, so
  # a bump changes generated output and the `r/ is stale` gate fails the PR
  # until someone runs `bun run build` and pushes the result onto the branch.
  #
  # That is the gate working, not a misconfiguration — the alternative is
  # shipping a registry advertising versions nobody verified. Grouped and
  # monthly so it is one rebuild a month rather than one per package.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      types:
        patterns: ["@types/*"]
      dev:
        dependency-type: development
