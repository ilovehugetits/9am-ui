<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9AM Script</title>
    <script>
      // Apply the saved theme to <html> before first paint so there is no
      // flash of the wrong theme. Keep the key in sync with the
      // `themeStorageKey` in src/nui.config.ts.
      (function () {
        try {
          var t = localStorage.getItem("9am-script:theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
